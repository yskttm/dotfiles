[tools]
node = "latest"
bun = "latest"
deno = "latest"
rust = "latest"
go = "latest"
ruby = "latest"
python = "latest"
uv = "latest"
aube = "latest"
ni = "latest"
pnpm = "latest"
yarn = "latest"
biome = "latest"
actionlint = "latest"
act = "latest"
kubectl = "latest"
k9s = "latest"
stern = "latest"
terraform = "latest"

[settings]
idiomatic_version_file_enable_tools = [
  "node",
  "ruby",
  "python",
  "pnpm",
  "yarn",
  "npm",
  "terraform",
]
trusted_config_paths = ["~/dotfiles"]
